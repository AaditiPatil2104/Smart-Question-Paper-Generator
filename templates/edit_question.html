<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Edit Question</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f7fc;">

<div class="container mt-5">

<div class="card shadow p-4">

<h3 class="mb-3 text-primary">Edit Question</h3>

<form method="POST" action="/update_question/{{ question.id }}">

<label>Subject</label>
<input
    type="text"
    name="subject"
    class="form-control mb-2"
    value="{{ question.subject }}"
>

<label>Type</label>
<select name="type" class="form-control mb-2">
    <option value="MCQ"
        {% if question.type == 'MCQ' %}selected{% endif %}>
        MCQ
    </option>

    <option value="Theory"
        {% if question.type == 'Theory' %}selected{% endif %}>
        Theory
    </option>

    <option value="University"
        {% if question.type == 'University' %}selected{% endif %}>
        University
    </option>
</select>

<label>Question</label>
<input
    type="text"
    name="question"
    class="form-control mb-2"
    value="{{ question.question }}"
>

<label>Option A</label>
<input
    type="text"
    name="option_a"
    class="form-control mb-2"
    value="{{ question.option_a }}"
>

<label>Option B</label>
<input
    type="text"
    name="option_b"
    class="form-control mb-2"
    value="{{ question.option_b }}"
>

<label>Option C</label>
<input
    type="text"
    name="option_c"
    class="form-control mb-2"
    value="{{ question.option_c }}"
>

<label>Option D</label>
<input
    type="text"
    name="option_d"
    class="form-control mb-2"
    value="{{ question.option_d }}"
>

<label>Answer</label>
<input
    type="text"
    name="answer"
    class="form-control mb-2"
    value="{{ question.answer }}"
>

<label>Difficulty Level</label>
<select name="difficulty" class="form-control mb-2">
<option value="Easy" {% if question.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
<option value="Medium" {% if question.difficulty == 'Medium' %}selected{% endif %}>Medium</option>
<option value="Hard" {% if question.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
<option value="" {% if not question.difficulty %}selected{% endif %}>Unclassified</option>
</select>

<label>Marks</label>
<input
    type="number"
    name="marks"
    class="form-control mb-3"
    value="{{ question.marks }}"
>

<button type="submit" class="btn btn-success w-100">
    Save Changes
</button>

</form>

</div>

</div>

</body>
</html>
