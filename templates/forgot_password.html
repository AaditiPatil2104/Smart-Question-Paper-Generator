<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/auth.css') }}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head><body class="auth-page"><div class="auth-shell"><div class="auth-card"><div class="auth-icon"><i class="bi bi-shield-lock-fill"></i></div><h2 class="auth-title">Forgot Password</h2><p class="auth-subtitle">Reset your Teacher or Coordinator account password.</p>{% if error %}<div class="alert alert-danger auth-alert">{{ error }}</div>{% endif %}{% if success %}<div class="alert alert-success auth-alert">{{ success }}</div>{% endif %}<form method="POST" onsubmit="return validateReset()"><div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" name="email" class="form-control" required></div><div class="mb-3"><label class="form-label">New Password</label><input id="new_password" type="password" name="new_password" class="form-control" minlength="6" maxlength="10" required></div><div class="mb-3"><label class="form-label">Confirm Password</label><input id="confirm_password" type="password" name="confirm_password" class="form-control" minlength="6" maxlength="10" required></div><button class="auth-btn w-100">Reset Password</button></form><div class="auth-back"><a href="/"><i class="bi bi-arrow-left"></i> Back to Home</a></div></div></div><script>function validateReset(){const e=email.value.trim(),p=new_password.value,c=confirm_password.value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){alert('Please enter a valid email address.');return false}if(p.length<6||p.length>10){alert('Password must be between 6 and 10 characters.');return false}if(p!==c){alert('Passwords do not match.');return false}return true}</script></body></html>
