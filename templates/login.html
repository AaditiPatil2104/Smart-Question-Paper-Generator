<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Teacher Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/auth.css') }}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head><body class="auth-page"><div class="auth-shell"><div class="auth-card"><div class="auth-icon"><i class="bi bi-person-workspace"></i></div><h2 class="auth-title">Teacher Login</h2><p class="auth-subtitle">Sign in to manage question papers and your question bank.</p>{% if error %}<div class="alert alert-danger auth-alert">{{ error }}</div>{% endif %}{% if success %}<div class="alert alert-success auth-alert">{{ success }}</div>{% endif %}<form method="POST" onsubmit="return validateLogin()"><div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" id="email" class="form-control" placeholder="Enter email" required></div><div class="mb-2"><label class="form-label">Password</label><input type="password" name="password" id="password" class="form-control" placeholder="Enter password" minlength="6" maxlength="10" required></div><div class="text-end mb-3"><a class="auth-link" href="/forgot_password">Forgot Password?</a></div><button class="auth-btn w-100">Login as Teacher</button></form><div class="auth-footer">New Teacher? <a class="auth-link" href="/register">Register Here</a><br><a class="auth-link" href="/hod/login">Go to Coordinator Login</a></div><div class="auth-back"><a href="/"><i class="bi bi-arrow-left"></i> Back to Home</a></div></div></div><script>function validateLogin(){const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert('Please enter a valid email address.');return false}if(password.length<6||password.length>10){alert('Password must be between 6 and 10 characters.');return false}return true}</script></body></html>
