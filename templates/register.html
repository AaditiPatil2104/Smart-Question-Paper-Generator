<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Teacher Registration</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/auth.css') }}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head><body class="auth-page"><div class="auth-shell"><div class="auth-card"><div class="auth-icon"><i class="bi bi-person-plus-fill"></i></div><h2 class="auth-title">Teacher Registration</h2><p class="auth-subtitle">Create your teacher account to start generating papers.</p>{% if error %}<div class="alert alert-danger auth-alert">{{ error }}</div>{% endif %}<form method="POST" onsubmit="return validateRegister()"><div class="mb-3"><label class="form-label">Full Name</label><input type="text" name="name" id="name" class="form-control" placeholder="Enter full name" pattern="[A-Za-z ]+" oninput="this.value=this.value.replace(/[^A-Za-z ]/g,'')" required></div><div class="mb-3"><label class="form-label">Contact Number</label><input type="tel" name="phone" id="phone" class="form-control" placeholder="10-digit contact number" inputmode="numeric" maxlength="10" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)" required></div><div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" id="email" class="form-control" placeholder="Enter email" required></div><div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" id="password" class="form-control" placeholder="6–10 characters" minlength="6" maxlength="10" required></div><button class="auth-btn w-100">Create Teacher Account</button></form><div class="auth-footer">Already registered? <a class="auth-link" href="/login">Login Here</a></div><div class="auth-back"><a href="/login"><i class="bi bi-arrow-left"></i> Back to Teacher Login</a></div></div></div><script>function validateRegister(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!/^[A-Za-z ]+$/.test(name)){alert('Name must contain only letters and spaces.');return false}if(!/^[6-9]\d{9}$/.test(phone)){alert('Contact number must be exactly 10 digits and start with 6, 7, 8 or 9.');return false}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert('Please enter a valid email address.');return false}if(password.length<6||password.length>10){alert('Password must be between 6 and 10 characters.');return false}return true}</script></body></html>
