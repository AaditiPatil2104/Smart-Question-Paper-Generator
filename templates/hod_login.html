<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coordinator Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/auth.css') }}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head><body class="auth-page"><div class="auth-shell"><div class="auth-card"><div class="auth-icon"><i class="bi bi-mortarboard-fill"></i></div><h2 class="auth-title">Coordinator Login</h2><p class="auth-subtitle">Monitor teachers, question papers, question bank and reports.</p>{% if error %}<div class="alert alert-danger auth-alert">{{ error }}</div>{% endif %}<form method="POST" onsubmit="return validateHodLogin()"><div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" id="email" class="form-control" required></div><div class="mb-2"><label class="form-label">Password</label><input type="password" name="password" id="password" class="form-control" minlength="6" maxlength="10" required></div><div class="text-end mb-3"><a class="auth-link" href="/forgot_password">Forgot Password?</a></div><button class="auth-btn w-100">Login as Coordinator</button></form><div class="auth-footer">New Coordinator? <a class="auth-link" href="/hod/register">Register Here</a><br><a class="auth-link" href="/login">Go to Teacher Login</a></div><div class="auth-back"><a href="/"><i class="bi bi-arrow-left"></i> Back to Home</a></div></div></div><script>function validateHodLogin(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert('Please enter a valid email address.');return false}if(password.length<6||password.length>10){alert('Password must be between 6 and 10 characters.');return false}return true}</script></body></html>
